[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "A CLI app for managing contacts and notes."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Daniil Derbas" },
    { name = "Leonid" },
    { name = "Andrii Koptiev" }
]
dependencies = ["colorama>=0.4.6"]

[project.optional-dependencies]
dev = ["types-colorama", "pytest>=8.0", "pytest-cov>=5.0", "ruff", "mypy"]
ai = ["anthropic>=1.0", "python-dotenv>=1.0"]

[project.scripts]
assistant = "personal_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "src"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, unused code, import order

