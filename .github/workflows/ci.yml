name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -e ".[dev,ai]"
      - run: black --check .
      - run: ruff check .
      - run: mypy src tests

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Python, the newest Python, and Windows
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,ai]"
      - run: pytest --cov=personal_assistant --cov-report=term-missing

  install:
    name: Install as a user
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the package into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .
      - name: Run the console command from another folder
        run: |
          cd "$RUNNER_TEMP"
          mkdir home
          printf 'add anna 0123456789\nall\nexit\n' | HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/venv/bin/assistant" | tee out.txt
          grep -q "Contact 'Anna' added" out.txt
          grep -q "Goodbye" out.txt
      - name: Data is kept after a restart
        run: |
          cd "$RUNNER_TEMP"
          printf 'all\nexit\n' | HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/venv/bin/assistant" | tee out.txt
          grep -q "0123456789" out.txt
